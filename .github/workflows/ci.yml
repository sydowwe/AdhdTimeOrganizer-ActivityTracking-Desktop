# Builds and tests every push to main and every pull request. release.yml runs this same job before it packs, so a
# release goes out behind exactly the gate main does. Read-only: nothing here publishes or writes to the repo.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# Actions are pinned to a commit, the release in the comment: a tag can be moved to other code, a commit cannot. To
# update, take the commit of the newer release tag (git ls-remote --tags https://github.com/actions/<name>) in both
# workflow files at once.

jobs:
  test:
    runs-on: windows-latest
    # A warning fails CI; a local build still only shows it. MSBuild reads these environment variables as properties, so
    # every build in this job is covered. NuGet's vulnerability-audit warnings (NU1901-NU1904) stay warnings: an advisory
    # published tomorrow must not block a release that has no fix to ship.
    env:
      TreatWarningsAsErrors: 'true'
      WarningsNotAsErrors: 'NU1901;NU1902;NU1903;NU1904'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      # Exactly the committed packages.lock.json, or fail. Every later restore here is locked as well (Directory.Build.props
      # sets RestoreLockedMode when CI=true); this step only makes a drifted lock file the first, plainly named failure.
      - name: Restore (locked)
        run: dotnet restore AdhdTimeOrganizer.ActivityTracking.Desktop.Tests/AdhdTimeOrganizer.ActivityTracking.Desktop.Tests.csproj --locked-mode

      # Every test, so a new class is covered by default, minus the NativeSmokeTests cases that need a signed-in desktop
      # (a monitor, an audio device, hotkeys and hooks), which carry the Needs=Desktop trait. The wire and vector tests
      # skip their server-copy check here: the server repo is not checked out beside this one.
      - name: Test
        shell: pwsh
        run: ./scripts/test.ps1 -NotTrait 'Needs=Desktop'

      # Release compiles the other ApiBaseUrl branch in AppConfig.
      - name: Release build
        shell: pwsh
        run: ./scripts/test.ps1 -BuildOnly
